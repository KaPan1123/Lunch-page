<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>明天中午吃什么？</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    overflow: hidden;
    position: relative;
    background: #e4002b;
    background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.05) 0 24px, transparent 24px 48px);
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .hidden { display: none !important; }

  /* ===== 背景装饰层 ===== */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .awning {
    position: absolute; top: 0; left: 0; right: 0; height: 52px;
    background: repeating-linear-gradient(90deg, #fff 0 42px, #e4002b 42px 84px);
    border-bottom: 4px solid #000;
  }
  .awning::after {
    content: '';
    position: absolute; top: 100%; left: 0; right: 0; height: 20px;
    background: radial-gradient(circle 20px at 50% 0, #fff 19px, transparent 20px);
    background-size: 42px 20px;
  }

  .bottom-stripes {
    position: absolute; bottom: 0; left: 0; right: 0; height: 42px;
    background: repeating-linear-gradient(90deg, #fff 0 36px, #e4002b 36px 72px);
    border-top: 4px solid #000;
  }

  .sign {
    position: absolute; top: 82px; left: 18px;
    background: #fff; border: 5px solid #000; border-radius: 16px;
    padding: 6px 22px;
    font-size: clamp(26px, 5vw, 44px); font-weight: 900;
    color: #e4002b; letter-spacing: 5px; line-height: 1;
    transform: rotate(-6deg);
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }

  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.15) 3px, transparent 3.5px);
    background-size: 46px 46px;
  }

  .food {
    position: absolute; z-index: 1;
    opacity: .85;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,.3));
    animation: bob 4s ease-in-out infinite;
  }
  .f1 { left: 4vw; bottom: 64px; font-size: 58px; }
  .f2 { right: 5vw; bottom: 68px; font-size: 52px; animation-delay: 1s; }
  .f3 { left: 5vw; top: 38%; font-size: 44px; animation-delay: 2s; }
  .f4 { right: 5vw; top: 16%; font-size: 46px; animation-delay: .5s; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-14px) rotate(6deg); }
  }

  /* ===== 主舞台 ===== */
  .stage {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding: 82px 24px 64px;
  }
  h1 {
    color: #fff;
    font-size: clamp(38px, 7.5vw, 76px);
    font-weight: 900;
    text-align: center;
    text-shadow: 0 4px 16px rgba(0,0,0,.45);
    z-index: 1;
    margin-top: 3vh;
  }

  .colonel-wrap {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    width: 100%;
  }
  .colonel-wrap svg {
    height: 100%; max-height: 48vh; max-width: 80vw;
    filter: drop-shadow(0 12px 26px rgba(0,0,0,.35));
    animation: bob 5s ease-in-out infinite;
  }

  /* ===== 按钮 ===== */
  .buttons { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: center; z-index: 1; }
  .btn {
    border: none; cursor: pointer;
    font-weight: 800;
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    transition: transform .15s ease, background .15s ease;
    will-change: transform;
    white-space: nowrap;
    touch-action: manipulation;
  }
  #eat-kfc {
    background: #fff;
    color: #e4002b;
    font-size: clamp(24px, 4vw, 36px);
    padding: 20px 56px;
  }
  #eat-kfc:hover { background: #ffe9ec; }
  #eat-other {
    background: rgba(255,255,255,.18);
    color: #fff;
    border: 2px solid rgba(255,255,255,.7);
    font-size: clamp(18px, 3vw, 24px);
    padding: 14px 36px;
  }

  /* ===== 庆祝效果 ===== */
  #celebration {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,.45) 0%, rgba(0,0,0,.8) 100%);
    pointer-events: none;
    overflow: hidden;
    opacity: 1;
    transition: opacity .5s;
  }
  #celebration.fade { opacity: 0; }

  .rays {
    position: absolute; left: 50%; top: 50%;
    width: 160vmax; height: 160vmax;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(rgba(255,215,0,.22) 0deg 9deg, transparent 9deg 30deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    animation: spin 7s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .glow {
    position: absolute; left: 50%; top: 50%;
    width: 62vmin; height: 62vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,224,120,.4), rgba(255,224,120,0) 70%);
    animation: pulse 1.1s ease-in-out infinite alternate;
  }
  @keyframes pulse {
    from { transform: translate(-50%, -50%) scale(.85); opacity: .7; }
    to { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
  }

  .big-text {
    position: relative; z-index: 2;
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: .05em;
    padding: 0 16px;
    text-align: center;
  }
  .ch {
    font-size: clamp(58px, 12vw, 128px);
    font-weight: 900;
    color: #ffd700;
    text-shadow: 0 4px 0 #a06a00, 0 12px 30px rgba(0,0,0,.65);
    animation: charIn .65s cubic-bezier(.2, 1.6, .4, 1) both;
  }
  @keyframes charIn {
    0% { transform: scale(0) rotate(-160deg); opacity: 0; }
    70% { transform: scale(1.12) rotate(6deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  #burst-layer, #sparkle-layer { position: absolute; inset: 0; z-index: 1; }
  .burst {
    position: absolute; left: 50%; top: 50%;
    width: 1em; height: 1em;
    margin-left: -.5em; margin-top: -.5em;
    display: flex; align-items: center; justify-content: center;
    animation-name: flyOut;
    animation-timing-function: cubic-bezier(.15, .7, .4, 1);
    animation-fill-mode: both;
  }
  @keyframes flyOut {
    0% { transform: translate(0, 0) scale(.4) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(300deg); opacity: 0; }
  }
  .spark {
    position: absolute;
    width: 6px; height: 6px; border-radius: 50%;
    background: #ffd700;
    box-shadow: 0 0 8px #ffd700;
    animation: sparkOut 1s ease-out both;
  }
  @keyframes sparkOut {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; }
  }

  #confetti-layer { position: fixed; inset: 0; z-index: 11; pointer-events: none; overflow: hidden; }
  .piece {
    position: absolute; top: -10vh;
    animation-name: fall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  .piece.rect { border-radius: 3px; }
  .piece.star { color: #ffd700; }
  .piece.streamer { border-radius: 2px; }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="bg">
    <div class="awning"></div>
    <div class="bottom-stripes"></div>
    <div class="sign">KFC</div>
    <div class="dots"></div>
    <div class="food f1">🍗</div>
    <div class="food f2">🍟</div>
    <div class="food f3">🥤</div>
    <div class="food f4">🍔</div>
  </div>

  <div class="stage">
    <h1>明天中午吃什么？</h1>
    <div class="colonel-wrap">
      <svg viewBox="0 0 400 500" aria-label="KFC老爷爷">
        <defs>
          <linearGradient id="suitG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#e2e6ea"/>
          </linearGradient>
          <linearGradient id="hairG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="1" stop-color="#dde2e6"/>
          </linearGradient>
          <linearGradient id="apronG" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e4002b"/>
            <stop offset="1" stop-color="#ad001f"/>
          </linearGradient>
          <radialGradient id="faceG" cx="0.5" cy="0.42" r="0.8">
            <stop offset="0" stop-color="#fdf5e6"/>
            <stop offset="1" stop-color="#f2ddc2"/>
          </radialGradient>
          <linearGradient id="lensG" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#3d3d3d"/>
            <stop offset="1" stop-color="#0d0d0d"/>
          </linearGradient>
        </defs>

        <!-- 白色西装 -->
        <path d="M 72 500 L 116 398 Q 124 354 192 350 L 208 350 Q 276 354 284 398 L 328 500 Z" fill="url(#suitG)" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
        <!-- 西装翻领 -->
        <path d="M 136 500 L 156 428 Q 166 416 184 412" fill="none" stroke="#c9ced3" stroke-width="5" stroke-linecap="round"/>
        <path d="M 264 500 L 244 428 Q 234 416 216 412" fill="none" stroke="#c9ced3" stroke-width="5" stroke-linecap="round"/>
        <!-- 口袋巾 -->
        <path d="M 158 388 L 182 388 L 170 408 Z" fill="#e4002b" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
        <!-- 红色围裙 -->
        <path d="M 150 500 L 150 434 Q 200 412 250 434 L 250 500 Z" fill="url(#apronG)" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
        <path d="M 159 500 L 159 440 Q 200 423 241 440 L 241 500" fill="none" stroke="#ad001f" stroke-width="4"/>
        <text x="200" y="478" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" font-weight="900" fill="#fff" letter-spacing="2">KFC</text>

        <!-- 衬衫与脖子 -->
        <path d="M 168 264 L 232 264 L 240 348 Q 200 372 160 348 Z" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
        <path d="M 178 268 L 200 302 L 222 268" fill="none" stroke="#d5d5d5" stroke-width="4" stroke-linecap="round"/>
        <!-- 下巴阴影 -->
        <ellipse cx="200" cy="278" rx="46" ry="10" fill="#000" opacity=".09"/>
        <!-- 黑色丝带领 -->
        <circle cx="200" cy="346" r="9" fill="#000"/>
        <path d="M 200 353 L 184 382 L 192 385 L 201 362 Z" fill="#000"/>
        <path d="M 200 353 L 216 382 L 208 385 L 199 362 Z" fill="#000"/>

        <!-- 头 -->
        <ellipse cx="200" cy="175" rx="90" ry="105" fill="url(#faceG)" stroke="#000" stroke-width="6"/>

        <!-- 白发 -->
        <path d="M 108 208 C 99 132 118 84 164 74 C 172 50 208 38 236 52 C 258 46 288 60 298 88 C 310 122 306 168 296 208 C 288 196 276 188 262 182 C 244 172 222 164 200 162 C 178 164 156 172 138 182 C 124 188 112 196 108 208 Z" fill="url(#hairG)"/>
        <!-- 发丝纹理 -->
        <path d="M 150 102 Q 176 92 204 96" fill="none" stroke="#d3d9de" stroke-width="4" stroke-linecap="round"/>
        <path d="M 192 68 Q 218 60 246 70" fill="none" stroke="#d3d9de" stroke-width="4" stroke-linecap="round"/>
        <path d="M 262 104 Q 282 118 292 142" fill="none" stroke="#d3d9de" stroke-width="4" stroke-linecap="round"/>
        <!-- 发际线阴影 -->
        <path d="M 114 212 C 124 198 138 184 152 176 C 170 168 186 164 200 164 C 214 164 230 168 248 176 C 262 184 276 198 286 212" fill="none" stroke="#e6cfa8" stroke-width="7" stroke-linecap="round" opacity=".55"/>

        <!-- 眼镜 -->
        <rect x="122" y="172" width="62" height="46" rx="15" fill="url(#lensG)" stroke="#000" stroke-width="5"/>
        <rect x="216" y="172" width="62" height="46" rx="15" fill="url(#lensG)" stroke="#000" stroke-width="5"/>
        <path d="M 133 189 L 145 177" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".4"/>
        <path d="M 229 189 L 241 177" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".4"/>
        <path d="M 184 190 Q 200 180 216 190" fill="none" stroke="#000" stroke-width="5"/>
        <path d="M 122 190 Q 106 186 94 190" fill="none" stroke="#000" stroke-width="5"/>
        <path d="M 278 190 Q 294 186 306 190" fill="none" stroke="#000" stroke-width="5"/>

        <!-- 鼻子 -->
        <path d="M 192 206 Q 200 198 208 206 Q 212 220 200 228 Q 188 220 192 206 Z" fill="#f0dfc2" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
        <path d="M 194 222 Q 196 224 198 222" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 202 222 Q 204 224 206 222" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 山羊胡 -->
        <path d="M 168 258 Q 178 250 200 252 Q 222 250 232 258 Q 224 292 200 306 Q 176 292 168 258 Z" fill="#fff" stroke="#d8cec0" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 192 268 Q 195 284 200 296" fill="none" stroke="#d5cdc0" stroke-width="2.5" stroke-linecap="round"/>

        <!-- 白胡子 -->
        <path d="M 199 240 Q 182 230 164 235 Q 170 245 183 249 Q 192 251 199 249 Z" fill="#fff" stroke="#d8cec0" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M 201 240 Q 218 230 236 235 Q 230 245 217 249 Q 208 251 201 249 Z" fill="#fff" stroke="#d8cec0" stroke-width="2.5" stroke-linejoin="round"/>

        <!-- 嘴 -->
        <path d="M 178 254 Q 200 268 222 254" fill="none" stroke="#000" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>




    
    <div class="buttons">
      <button class="btn" id="eat-kfc">吃KFC</button>
      <button class="btn" id="eat-other">吃其他的</button>
    </div>
  </div>

  <div id="celebration" class="hidden">
    <div class="rays"></div>
    <div class="glow"></div>
    <div id="burst-layer"></div>
    <div id="sparkle-layer"></div>
    <div class="big-text" id="big-text"></div>
  </div>
  <div id="confetti-layer"></div>

<script>
(function () {
  var kfc = document.getElementById('eat-kfc');
  var other = document.getElementById('eat-other');
  var celebration = document.getElementById('celebration');
  var confettiLayer = document.getElementById('confetti-layer');

  var kfcScale = 1;
  var otherScale = 1;

  function dodge() {
    otherScale = Math.max(0.25, otherScale * 0.8);
    other.style.transform = 'scale(' + otherScale + ')';

    other.style.position = 'fixed';
    other.style.margin = '0';
    var margin = 16;
    var w = other.offsetWidth * otherScale;
    var h = other.offsetHeight * otherScale;
    var maxX = window.innerWidth - w - margin;
    var maxY = window.innerHeight - h - margin;
    var kfcRect = kfc.getBoundingClientRect();
    var pad = 12;
    var x, y, tries = 0;
    do {
      x = margin + Math.random() * Math.max(margin, maxX);
      y = margin + Math.random() * Math.max(margin, maxY);
      tries++;
    } while (
      tries < 20 &&
      x < kfcRect.left + kfcRect.width + pad && x + w + pad > kfcRect.left &&
      y < kfcRect.top + kfcRect.height + pad && y + h + pad > kfcRect.top
    );
    other.style.left = x + 'px';
    other.style.top = y + 'px';

    kfcScale = Math.min(2.6, kfcScale * 1.12);
    kfc.style.transform = 'scale(' + kfcScale + ')';
  }

  // 点击（手机端为点按）之后才躲开
  other.addEventListener('click', dodge);

  var clearTimer;
  var bigText = document.getElementById('big-text');
  var burstLayer = document.getElementById('burst-layer');
  var sparkleLayer = document.getElementById('sparkle-layer');

  function celebrate() {
    clearTimeout(clearTimer);
    confettiLayer.innerHTML = '';
    burstLayer.innerHTML = '';
    sparkleLayer.innerHTML = '';
    celebration.classList.remove('hidden', 'fade');

    var chars = '请你吃肯德基'.split('');
    var html = '';
    for (var i = 0; i < chars.length; i++) {
      html += '<span class="ch" style="animation-delay:' + (i * 0.08) + 's">' + chars[i] + '</span>';
    }
    html += '<span class="ch" style="animation-delay:' + (chars.length * 0.08 + 0.1) + 's">🍔</span>';
    bigText.innerHTML = html;

    spawnConfetti();
    emojiBurst();
    sparkleBurst();

    clearTimer = setTimeout(function () {
      celebration.classList.add('fade');
      setTimeout(function () {
        celebration.classList.add('hidden');
        confettiLayer.innerHTML = '';
        burstLayer.innerHTML = '';
        sparkleLayer.innerHTML = '';
      }, 500);
    }, 4200);
  }

  function spawnConfetti() {
    var emojis = ['🍔','🍗','🍟','🥤','🎉','✨','🎊'];
    var colors = ['#e4002b','#ffd700','#fff','#ff5b3d','#00b140'];
    for (var i = 0; i < 150; i++) {
      var p = document.createElement('div');
      p.className = 'piece';
      var r = Math.random();
      if (r < 0.3) {
        p.classList.add('emoji');
        p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.fontSize = (18 + Math.random() * 26) + 'px';
      } else if (r < 0.45) {
        p.classList.add('star');
        p.textContent = '✦';
        p.style.fontSize = (14 + Math.random() * 20) + 'px';
      } else if (r < 0.65) {
        p.classList.add('streamer');
        p.style.width = '8px';
        p.style.height = (26 + Math.random() * 26) + 'px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
      } else {
        p.classList.add('rect');
        var s = 6 + Math.random() * 10;
        p.style.width = s + 'px';
        p.style.height = s + 'px';
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
      }
      p.style.left = (Math.random() * 100) + 'vw';
      p.style.animationDuration = (2.2 + Math.random() * 2.2) + 's';
      p.style.animationDelay = (Math.random() * 0.8) + 's';
      confettiLayer.appendChild(p);
    }
  }

  function emojiBurst() {
    var emojis = ['🍔','🍗','🍟','🥤','🎉','✨'];
    for (var i = 0; i < 26; i++) {
      var e = document.createElement('span');
      e.className = 'burst';
      e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      var ang = Math.random() * Math.PI * 2;
      var dist = 24 + Math.random() * 38;
      e.style.setProperty('--dx', Math.cos(ang) * dist + 'vmin');
      e.style.setProperty('--dy', Math.sin(ang) * dist + 'vmin');
      e.style.fontSize = (20 + Math.random() * 22) + 'px';
      e.style.animationDuration = (0.9 + Math.random() * 0.5) + 's';
      e.style.animationDelay = (Math.random() * 0.2) + 's';
      burstLayer.appendChild(e);
    }
  }

  function sparkleBurst() {
    var colors = ['#ffd700', '#fff', '#ff9d00'];
    for (var b = 0; b < 5; b++) {
      var x = 8 + Math.random() * 84;
      var y = 8 + Math.random() * 74;
      for (var i = 0; i < 9; i++) {
        var s = document.createElement('span');
        s.className = 'spark';
        s.style.left = x + '%';
        s.style.top = y + '%';
        var ang = (i / 9) * Math.PI * 2;
        var dist = 28 + Math.random() * 48;
        s.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
        s.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
        s.style.background = colors[Math.floor(Math.random() * colors.length)];
        s.style.boxShadow = '0 0 8px ' + s.style.background;
        s.style.animationDelay = (0.4 + b * 0.35 + Math.random() * 0.3) + 's';
        sparkleLayer.appendChild(s);
      }
    }
  }

  kfc.addEventListener('click', celebrate);
})();
</script>
</body>
</html>
